name: Build

on: [push, pull_request]

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: sudo apt-get install -y libgles2-mesa-dev

      - name: Build Desktop
        run: python3 scripts/build.py desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live2d-desktop-${{ matrix.os }}
          path: out/*.jar

  android:
    name: Android Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Android
        run: python3 scripts/build.py android

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live2d-android
          path: out/*.jar
